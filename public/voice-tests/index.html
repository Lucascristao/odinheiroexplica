<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Teste de vozes | O Dinheiro Explica</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #f5f5f5;
        background: #090b0d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main { width: min(720px, 100%); }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 5vw, 44px);
      }
      p {
        margin: 0 0 28px;
        color: #a5adb6;
        line-height: 1.6;
      }
      .voice {
        padding: 18px;
        margin: 12px 0;
        border: 1px solid #282d33;
        border-radius: 16px;
        background: #111418;
      }
      .voice strong {
        display: block;
        color: #ffbd19;
        margin-bottom: 5px;
      }
      .voice span {
        display: block;
        margin-bottom: 12px;
        color: #a5adb6;
        font-size: 13px;
      }
      audio { width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>Teste de vozes Azure pt-BR</h1>
      <p>
        O mesmo texto é lido por três vozes neurais brasileiras.
        O objetivo é escolher naturalidade, dicção e ritmo para vídeos longos.
      </p>

      <section class="voice">
        <strong>Francisca</strong>
        <span>pt-BR-FranciscaNeural</span>
        <audio controls preload="metadata" src="./francisca.mp3"></audio>
      </section>

      <section class="voice">
        <strong>Fabio</strong>
        <span>pt-BR-FabioNeural</span>
        <audio controls preload="metadata" src="./fabio.mp3"></audio>
      </section>

      <section class="voice">
        <strong>Nicolau</strong>
        <span>pt-BR-NicolauNeural</span>
        <audio controls preload="metadata" src="./nicolau.mp3"></audio>
      </section>
    </main>
  </body>
</html>
