name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Explicit direct production leaves permanent suites available for other runs.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[production direct]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Validate daily editorial contract
        run: npm run validate:editorial -- video/data/daily.json --require-explanation

      - name: Normalize current episode for layout audit
        run: python worker/editorial_project.py --input video/data/daily.json --output video/generated/daily-project.json

      - name: Check current episode with production font
        id: layout_geometry
        timeout-minutes: 10
        run: |
          npm run validate:layout -- \
            --project video/generated/daily-project.json \
            --mode geometry-only \
            --output video/generated/daily-layout-geometry.json \
            --frames-dir render-output/layout-geometry

      - name: Upload current episode layout diagnostics
        if: always() && hashFiles('video/generated/daily-layout-geometry.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-layout-ci
          path: |
            video/data/daily.json
            video/generated/daily-project.json
            video/generated/daily-layout-geometry.json
            render-output/layout-geometry/
          if-no-files-found: error
          retention-days: 7

      - name: Test explanatory contract and shared layout
        run: |
          npm run test:explanation
          npm run test:layout
          npm run test:direction
          npm run test:motion
          npm run test:preflight
          npm run test:portable
          npm run prepare:hyperframes -- --preflight

      - name: Validate Python pipeline
        run: python -m py_compile worker/editorial_project.py worker/qa_delivery.py worker/render_request.py worker/tts_config.py worker/gemini_live_fidelity.py worker/synthesize_scenes.py worker/process_voice_continuity.py worker/restore_reviewed_audio.py worker/build_render_input.py worker/build_youtube_package.py worker/editorial_source_audit.py worker/prepare_visual_assets.py worker/auto_capture_sources.py worker/voice_master.py worker/review_rendered_video.py worker/deliver_supplement.py

      - name: Test source-capture navigation retry (offline)
        run: python worker/test_auto_capture_sources.py

      - name: Validate render request, packaging and retry policy (offline)
        run: |
          python worker/test_render_request.py
          python worker/test_youtube_package.py
          python worker/test_production_workflow.py

      - name: Validate canonical voice policy and documentation
        run: |
          python worker/validate_voice_policy.py
          python worker/test_tts_direction.py

      - name: Install audio regression dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # The Remotion compositor binary omits rawvideo/lavfi; the full pipeline needs stock FFmpeg.
          python -m pip install --disable-pip-version-check "numpy>=1.26" "Pillow>=10.4" "num2words>=0.5.13,<1" "google-genai==2.26.0"

      - name: Test review of encoded pixels (offline)
        run: |
          python worker/test_review_rendered_video.py
          python worker/test_voice_master.py

      - name: Test Gemini Live cache, fidelity and timing (offline)
        run: python worker/test_synthesize_scenes.py

      - name: Test reviewed audio provenance and legacy cache (offline)
        run: |
          python worker/test_restore_reviewed_audio.py
          python worker/test_restore_completed_render.py

      - name: Test narration anchor alignment (offline)
        run: python worker/test_align_narration.py

      - name: Test Gemini Live byte-identical passthrough
        run: python worker/test_process_voice_continuity.py

      - name: Test delivery integrity and Live policy (offline)
        run: python worker/test_qa_delivery.py

      - name: Audit daily source balance
        run: python worker/editorial_source_audit.py --input video/data/daily.json --output /tmp/daily-source-audit.json --strict

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Remotion compositions
        run: npx remotion compositions video/src/index.ts
