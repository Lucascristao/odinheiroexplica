name: ODE Noticias - pesquisar 3x ao dia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-scout.yml
      - worker/news_scout.py
  schedule:
    # America/Sao_Paulo (UTC-3): 06h, 10h, 18h. GitHub pode atrasar execução.
    - cron: '0 9,13,21 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Descobrir manchetes recentes sem custo de API
        run: python worker/news_scout.py --output news/outbox/candidates.json
      - name: Preservar pesquisa para apuração e seleção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ode-news-candidates
          path: news/outbox/candidates.json
          if-no-files-found: warn
          retention-days: 3
