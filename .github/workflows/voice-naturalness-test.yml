name: Teste A-B naturalidade Macerio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-naturalness-test.yml"

permissions:
  contents: read

jobs:
  voice-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r worker/requirements.txt

      - name: Generate A-B samples and upload to Drive
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          from xml.sax.saxutils import escape
          import requests

          sys.path.insert(0, "worker")
          from synthesize_scenes import build_ssml
          from drive import uploader_from_env

          text = (
              "Tem uma coisa curiosa quando a gente fala de dinheiro: quase sempre o problema parece maior "
              "quando a gente olha tudo de uma vez. Mas muda bastante quando você separa as partes. "
              "Quanto entra? Quanto sai? E, principalmente, o que está levando seu dinheiro embora sem você perceber? "
              "Não é sobre cortar tudo. É sobre entender o caminho. Porque, quando o dinheiro deixa de ser uma bagunça "
              "e vira informação, as decisões começam a ficar muito mais simples."
          )

          voice = "pt-BR-MacerioMultilingualNeural"
          region = os.environ["AZURE_SPEECH_REGION"].strip()
          key = os.environ["AZURE_SPEECH_KEY"].strip()
          endpoint = f"https://{region}.tts.speech.microsoft.com/cognitiveservices/v1"

          def request_audio(ssml, path):
              response = requests.post(
                  endpoint,
                  headers={
                      "Ocp-Apim-Subscription-Key": key,
                      "Content-Type": "application/ssml+xml",
                      "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3",
                      "User-Agent": "odinheiroexplica-voice-ab",
                  },
                  data=ssml.encode("utf-8"),
                  timeout=90,
              )
              response.raise_for_status()
              Path(path).write_bytes(response.content)

          # A: comportamento antigo, com cadência mais regular e pitch global +1%.
          old_parts = []
          import re
          sentences = [p.strip() for p in re.split(r"(?<=[.!?])\s+", text) if p.strip()]
          for index, sentence in enumerate(sentences):
              words = sentence.split()
              rate = 0
              pitch = 1
              if sentence.endswith("?"):
                  pitch += 2
                  rate -= 1
              elif len(words) <= 7:
                  rate += 1
              elif index % 3 == 1:
                  rate += 1
              elif index % 3 == 2:
                  rate -= 1
              rate_txt = f"{rate:+d}%" if rate else "0%"
              pitch_txt = f"{pitch:+d}%" if pitch else "0%"
              old_parts.append(
                  f'<s><prosody rate="{rate_txt}" pitch="{pitch_txt}">{escape(sentence)}</prosody></s>'
              )
              if index < len(sentences) - 1:
                  old_parts.append('<break time="115ms"/>')
          old_body = "\n".join(old_parts)
          old_ssml = f'''<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="pt-BR">
          <voice xml:lang="pt-BR" name="{voice}">{old_body}</voice></speak>'''

          # B: comportamento novo do projeto.
          new_ssml = build_ssml(text, voice, {"rate": "0%", "pitch": "0%", "pause_ms": 185})

          a = Path("/tmp/macerio-A-antiga.mp3")
          b = Path("/tmp/macerio-B-natural.mp3")
          request_audio(old_ssml, a)
          request_audio(new_ssml, b)

          uploader = uploader_from_env()
          if uploader is None:
              raise RuntimeError("Google Drive não configurado.")
          folder_id = uploader.create_folder("Teste voz Macerio - A-B naturalidade")
          a_id = uploader.upload(a, a.name, folder_id=folder_id)
          b_id = uploader.upload(b, b.name, folder_id=folder_id)

          print(f"FOLDER_ID={folder_id}")
          print(f"A_FILE_ID={a_id}")
          print(f"B_FILE_ID={b_id}")
          print("VOICE_AB_OK")
          PY
