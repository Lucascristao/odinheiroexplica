name: Retomar entrega de MP4 aprovado - O Dinheiro Explica

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run do render diário na main com MP4 e QA concluídos"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ode-resume-delivery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ODE_PROGRESS_URL: https://odinheiroexplica.netlify.app/.netlify/functions/render-progress
      ODE_PROGRESS_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ODE_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read current project metadata
        run: |
          python worker/editorial_project.py --input video/data/daily.json --output video/generated/daily-project.json
          python worker/render_request.py --project video/generated/daily-project.json >> "$GITHUB_ENV"

      - name: Report delivery recovery
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" --title "$ODE_VIDEO_TITLE" \
            --status running --stage preparando --percent 5 \
            --detail "Retomando o MP4 já aprovado. A voz e o vídeo originais serão preservados."

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review and delivery dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check requests numpy Pillow num2words google-auth google-api-python-client
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Download original completed render
        uses: actions/download-artifact@v4
        with:
          name: daily-production-review
          path: work/completed-render
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify provenance and restore only approved derivatives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python worker/restore_completed_render.py --artifact-dir work/completed-render

      - name: Recheck actual final video and original audio
        run: |
          python worker/qa_delivery.py \
            --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json \
            --tts-manifest video/generated/daily-aligned-tts-manifest.json \
            --audio-dir public/processed-audio/daily \
            --video render-output/daily-video.mp4 \
            --output video/generated/daily-delivery-qa.json

      - name: Extract review evidence from the final encoded video
        id: review
        continue-on-error: true
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" --title "$ODE_VIDEO_TITLE" \
            --status running --stage dependencias --percent 45 \
            --detail "Conferindo o MP4 original e extraindo quadros reais para revisão."
          python worker/review_rendered_video.py \
            --input video/generated/daily-render-input.json \
            --video render-output/daily-video.mp4 \
            --output-dir render-output/visual-review

      - name: Record review outcome without claiming semantic approval
        env:
          ODE_REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("video/generated/daily-resume-receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          outcome = os.environ["ODE_REVIEW_OUTCOME"]
          receipt["review_extraction_outcome"] = outcome
          receipt["semantic_review"] = "pending-agent-review"
          receipt["review_package_available"] = outcome == "success" and Path("render-output/daily-visual-review.zip").is_file()
          receipt["delivery_qa_status"] = json.loads(Path("video/generated/daily-delivery-qa.json").read_text(encoding="utf-8"))["status"]
          path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if outcome != "success":
              print("Extração diagnóstica não concluída; entrega seguirá após QA de integridade aprovado, sem declarar revisão semântica.")
          PY

      - name: Upload recovered production review artifact
        if: always() && hashFiles('video/generated/daily-resume-receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-production-review
          path: |
            video/generated/
            render-output/daily-video.mp4
            render-output/daily-youtube.json
            render-output/daily-youtube.txt
            render-output/visual-review/
            render-output/daily-visual-review.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload approved package to Google Drive
        env:
          ODE_REVIEW_OUTCOME: ${{ steps.review.outcome }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" --title "$ODE_VIDEO_TITLE" \
            --status running --stage publicando --percent 94 \
            --detail "Enviando o MP4 aprovado e seu pacote de publicação ao Google Drive."
          REVIEW_ARGS=()
          if [ "$ODE_REVIEW_OUTCOME" = "success" ] && [ -f render-output/daily-visual-review.zip ]; then
            REVIEW_ARGS=(--review-package render-output/daily-visual-review.zip)
          fi
          python worker/upload_outputs_to_drive.py \
            --video render-output/daily-video.mp4 \
            --metadata render-output/daily-youtube.json \
            --publication-text render-output/daily-youtube.txt \
            --project-slug "$ODE_PROJECT_SLUG" \
            --output render-output/daily-drive.json "${REVIEW_ARGS[@]}"

      - name: Save delivery and recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-delivery-receipt
          path: |
            render-output/daily-drive.json
            video/generated/daily-resume-receipt.json
            video/generated/daily-delivery-qa.json
          if-no-files-found: warn
          retention-days: 7

      - name: Finish recovered production
        run: |
          VIDEO_DURATION=$(python -c 'import json; p=json.load(open("video/generated/daily-render-input.json")); print(round(p["duration_in_frames"]/p["fps"], 2))')
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" --title "$ODE_VIDEO_TITLE" \
            --status completed --stage concluido --percent 100 \
            --detail "Vídeo original e pacote de publicação entregues no Drive. A capa continua no chat." \
            --delivery-manifest render-output/daily-drive.json \
            --video-duration-seconds "$VIDEO_DURATION"

      - name: Report recovery failure
        if: failure()
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" --title "${ODE_VIDEO_TITLE:-Vídeo em produção}" \
            --status error --stage erro --percent 100 \
            --detail "A retomada da entrega falhou. Voz e vídeo originais continuam preservados; consulte a etapa com erro no Actions."
