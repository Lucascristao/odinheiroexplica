name: Render vídeo diário - O Dinheiro Explica

on:
  workflow_dispatch:
    inputs:
      force_fresh_audio:
        description: "Gerar novos áudios nesta execução; reexecuções retomam o cache"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "render-trigger/daily.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: ode-gemini-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ODE_PROGRESS_URL: https://odinheiroexplica.netlify.app/.netlify/functions/render-progress
      ODE_PROGRESS_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ODE_ESTIMATED_RENDER_SECONDS: 1200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize portable editorial project
        run: python worker/editorial_project.py --input video/data/daily.json --output video/generated/daily-project.json

      - name: Read project metadata
        env:
          ODE_REQUESTED_FRESH_AUDIO: ${{ inputs.force_fresh_audio || false }}
        shell: bash
        run: |
          python worker/render_request.py --project video/generated/daily-project.json >> "$GITHUB_ENV"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Node for editorial preparation
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare editorial engine
        run: npm ci --no-audit --no-fund

      - name: Compile editorial contract before paid synthesis
        id: editorial_contract
        run: npm run validate:editorial -- video/data/daily.json --require-explanation

      - name: Typecheck before narration
        run: npm run typecheck

      - name: Validate portable HyperFrames contracts before narration
        run: npm run prepare:hyperframes -- --preflight

      - name: Validate canonical voice policy before narration
        run: python worker/validate_voice_policy.py

      - name: Audit source balance before dependencies and TTS
        run: |
          mkdir -p video/generated
          python worker/editorial_source_audit.py \
            --input video/generated/daily-project.json \
            --output video/generated/daily-source-audit.json \
            --strict

      - name: Audit pronunciation before dependencies and TTS
        run: |
          python worker/pronunciation_audit.py \
            --input video/generated/daily-project.json \
            --output video/generated/daily-pronunciation-audit.json \
            --strict

      - name: Check geometry with production font before asset dependencies
        id: layout_geometry
        timeout-minutes: 10
        run: |
          npm run validate:layout -- \
            --project video/generated/daily-project.json \
            --mode geometry-only \
            --output video/generated/daily-layout-geometry.json \
            --frames-dir render-output/layout-geometry

      - name: Upload early layout diagnostics
        if: always() && hashFiles('video/generated/daily-layout-geometry.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-layout-preparation
          path: |
            video/data/daily.json
            video/generated/daily-project.json
            video/generated/daily-layout-geometry.json
            render-output/layout-geometry/
          if-no-files-found: error
          retention-days: 7

      - name: Report start
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage preparando \
            --percent 3 \
            --detail "Preparando o vídeo diário."

      - name: Install system dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # The Remotion compositor binary omits rawvideo/lavfi; the full pipeline needs stock FFmpeg.

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r worker/requirements.txt

      - name: Detect documentary capture requirements
        id: capture
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from importlib.metadata import version
          with open("video/generated/daily-project.json", encoding="utf-8") as source:
              project = json.load(source)
          required = any(asset.get("type") == "source_excerpt" for asset in project.get("visual_assets", []))
          print(f"required={'true' if required else 'false'}")
          print(f"playwright_version={version('playwright')}")
          PY

      - name: Restore document capture browser
        if: steps.capture.outputs.required == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.capture.outputs.playwright_version }}

      - name: Install document capture browser
        if: steps.capture.outputs.required == 'true'
        run: python -m playwright install chromium

      - name: Generate editorial sound design
        run: |
          rm -rf public/generated-sfx
          python worker/generate_sound_design.py --output-dir public/generated-sfx

      - name: Auto-capture editorial source excerpts
        if: steps.capture.outputs.required == 'true'
        run: |
          mkdir -p research/captures
          python worker/auto_capture_sources.py \
            --project video/generated/daily-project.json \
            --captures-dir research/captures

      - name: Prepare narrative visual assets
        run: |
          rm -rf public/generated-assets
          mkdir -p public/generated-assets video/generated
          python worker/prepare_visual_assets.py \
            --project video/generated/daily-project.json \
            --output-dir public/generated-assets \
            --manifest video/generated/daily-visual-assets.json

      - name: Check composition with production font before narration
        id: layout_assets
        run: |
          npm run validate:layout -- \
            --project video/generated/daily-project.json \
            --visual-assets-manifest video/generated/daily-visual-assets.json \
            --output video/generated/daily-layout-preflight.json \
            --frames-dir render-output/layout-preflight

      - name: Restore matching Gemini audio
        if: env.ODE_FORCE_FRESH_AUDIO != 'true'
        uses: actions/cache/restore@v4
        with:
          path: public/generated-audio/daily
          key: gemini-live-audio-v1-${{ env.ODE_VOICE_POLICY_VERSION }}-${{ env.ODE_VOICE_POLICY_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gemini-live-audio-v1-${{ env.ODE_VOICE_POLICY_VERSION }}-${{ env.ODE_VOICE_POLICY_CACHE_KEY }}-${{ github.run_id }}-
            gemini-live-audio-v1-${{ env.ODE_VOICE_POLICY_VERSION }}-${{ env.ODE_VOICE_POLICY_CACHE_KEY }}-

      - name: Restore reviewed audio when requested
        if: env.ODE_FORCE_FRESH_AUDIO != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python worker/restore_reviewed_audio.py \
            --project video/generated/daily-project.json \
            --trigger-file render-trigger/daily.txt \
            --output-dir public/generated-audio/daily

      - name: Generate presenter audio per scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage audio \
            --percent 10 \
            --detail "Pronúncia revisada. Gerando a narração com a voz do apresentador."

          if [ "$ODE_FORCE_FRESH_AUDIO" = "true" ]; then
            echo "[Audio Engine] Execução do zero solicitada; ignorando cache e artifacts anteriores."
            rm -rf public/generated-audio/daily
          fi
          mkdir -p public/generated-audio/daily video/generated render-output
          python worker/synthesize_scenes.py \
            --input video/generated/daily-project.json \
            --output-dir public/generated-audio/daily \
            --manifest video/generated/daily-tts-manifest.json \
            --diagnostics video/generated/daily-live-diagnostics.json

      - name: Save partial Gemini audio for a safe retry
        if: always() && hashFiles('public/generated-audio/daily/*.tts.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/generated-audio/daily
          key: gemini-live-audio-v1-${{ env.ODE_VOICE_POLICY_VERSION }}-${{ env.ODE_VOICE_POLICY_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify raw Gemini Live narration
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage audio \
            --percent 18 \
            --detail "Verificando o áudio bruto do Gemini Live. Nenhum EQ, limiter, compressor ou normalização é aplicado."

          python worker/process_voice_continuity.py \
            --input-manifest video/generated/daily-tts-manifest.json \
            --source-dir public/generated-audio/daily \
            --output-dir public/processed-audio/daily \
            --output-manifest video/generated/daily-processed-tts-manifest.json

      - name: Align visual anchors with real narration
        run: |
          python worker/align_narration.py \
            --project video/generated/daily-project.json \
            --input-manifest video/generated/daily-processed-tts-manifest.json \
            --source-dir public/processed-audio/daily \
            --output-manifest video/generated/daily-aligned-tts-manifest.json \
            --report video/generated/daily-alignment-report.json

      - name: Build timeline from real narration
        run: |
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage timeline \
            --percent 20 \
            --detail "Narração pronta. Medindo a duração real e montando a timeline."

          python worker/build_render_input.py \
            --project video/generated/daily-project.json \
            --tts-manifest video/generated/daily-aligned-tts-manifest.json \
            --require-gemini \
            --require-voice-continuity \
            --audio-public-prefix processed-audio/daily \
            --audio-dir public/processed-audio/daily \
            --visual-assets-manifest video/generated/daily-visual-assets.json \
            --output video/generated/daily-render-input.json

          npx tsx scripts/report-editorial-rhythm.ts \
            --input video/generated/daily-render-input.json \
            --output video/generated/daily-rhythm-report.json

      - name: Restore authored visual clips
        uses: actions/cache/restore@v4
        with:
          path: public/generated-clips
          key: hyperframes-art-v1-${{ hashFiles('package-lock.json', 'video/hyperframes/**', 'video/data/daily.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hyperframes-art-v1-${{ hashFiles('package-lock.json', 'video/hyperframes/**', 'video/data/daily.json') }}-

      - name: Prepare HyperFrames art with the actual narration clock
        run: npm run prepare:hyperframes

      - name: Save valid authored visual clips
        if: always() && hashFiles('public/generated-clips/*.mp4.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/generated-clips
          key: hyperframes-art-v1-${{ hashFiles('package-lock.json', 'video/hyperframes/**', 'video/data/daily.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate editorial background music
        run: |
          rm -rf public/generated-music
          python worker/generate_music.py \
            --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json \
            --output-dir public/generated-music

      - name: Check layout with the actual narration clock
        id: layout_final
        run: |
          npm run validate:layout -- \
            --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json \
            --output video/generated/daily-layout-final.json \
            --frames-dir render-output/layout-final

      - name: Build YouTube package
        run: |
          python worker/build_youtube_package.py \
            --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json \
            --output render-output/daily-youtube.json

          VIDEO_DURATION=$(python -c 'import json; p=json.load(open("video/generated/daily-render-input.json")); print(round(p["duration_in_frames"]/p["fps"], 2))')
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage dependencias \
            --percent 28 \
            --detail "Timeline pronta. Preparando o Remotion." \
            --video-duration-seconds "$VIDEO_DURATION"

      - name: Render video with live progress
        shell: bash
        run: |
          set +e
          VIDEO_DURATION=$(python -c 'import json; p=json.load(open("video/generated/daily-render-input.json")); print(round(p["duration_in_frames"]/p["fps"], 2))')
          START=$(date +%s)

          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage render \
            --percent 35 \
            --detail "Renderizando o vídeo em 1920×1080." \
            --eta-seconds "$ODE_ESTIMATED_RENDER_SECONDS" \
            --video-duration-seconds "$VIDEO_DURATION"

          npm run render:daily &
          RENDER_PID=$!

          while kill -0 "$RENDER_PID" 2>/dev/null; do
            sleep 30
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            PCT=$((35 + ELAPSED * 54 / ODE_ESTIMATED_RENDER_SECONDS))
            if [ "$PCT" -gt 89 ]; then PCT=89; fi
            ETA=$((ODE_ESTIMATED_RENDER_SECONDS - ELAPSED))
            if [ "$ETA" -lt 0 ]; then ETA=0; fi

            python worker/progress_callback.py \
              --run-id "${{ github.run_id }}" \
              --title "$ODE_VIDEO_TITLE" \
              --status running \
              --stage render \
              --percent "$PCT" \
              --detail "Renderizando os frames do vídeo." \
              --eta-seconds "$ETA" \
              --video-duration-seconds "$VIDEO_DURATION"
          done

          wait "$RENDER_PID"
          CODE=$?

          if [ "$CODE" -ne 0 ]; then
            python worker/progress_callback.py \
              --run-id "${{ github.run_id }}" \
              --title "$ODE_VIDEO_TITLE" \
              --status error \
              --stage erro \
              --percent 100 \
              --detail "O render falhou. O erro ficou registrado no GitHub Actions." \
              --video-duration-seconds "$VIDEO_DURATION"
            exit "$CODE"
          fi

      - name: Verify delivery before Drive
        run: |
          python worker/qa_delivery.py \
            --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json \
            --tts-manifest video/generated/daily-aligned-tts-manifest.json \
            --audio-dir public/processed-audio/daily \
            --video render-output/daily-video.mp4 \
            --output video/generated/daily-delivery-qa.json

      - name: Extract review evidence from the final encoded video
        run: |
          python worker/review_rendered_video.py \
            --input video/generated/daily-render-input.json \
            --video render-output/daily-video.mp4 \
            --output-dir render-output/visual-review

      - name: Upload production review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-production-review
          path: |
            video/data/daily.json
            video/generated/daily-project.json
            video/generated/daily-layout-geometry.json
            video/generated/daily-layout-preflight.json
            video/generated/daily-layout-final.json
            video/generated/daily-delivery-qa.json
            video/generated/daily-source-audit.json
            video/generated/daily-pronunciation-audit.json
            video/generated/daily-visual-assets.json
            research/captures/
            public/generated-assets/
            render-output/layout-geometry/
            render-output/layout-preflight/
            render-output/layout-final/
            render-output/daily-video.mp4
            render-output/daily-youtube.json
            render-output/daily-youtube.txt
            video/generated/daily-tts-manifest.json
            video/generated/daily-live-diagnostics.json
            video/generated/daily-processed-tts-manifest.json
            video/generated/daily-aligned-tts-manifest.json
            video/generated/daily-alignment-report.json
            video/generated/daily-voice-master-report.json
            video/generated/daily-rhythm-report.json
            video/generated/daily-render-input.json
            public/generated-audio/daily/*.wav
            public/processed-audio/daily/*
            public/generated-music/*
            public/generated-clips/
            video/generated/daily-hyperframes-*.json
            render-output/visual-review/
            render-output/daily-visual-review.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload package to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$GOOGLE_REFRESH_TOKEN" ] || [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "Google Drive não configurado. A entrega não pode ser concluída."
            exit 1
          fi

          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status running \
            --stage publicando \
            --percent 94 \
            --detail "Enviando vídeo e pacote de publicação para o Google Drive."

          python worker/upload_outputs_to_drive.py \
            --video render-output/daily-video.mp4 \
            --metadata render-output/daily-youtube.json \
            --publication-text render-output/daily-youtube.txt \
            --review-package render-output/daily-visual-review.zip \
            --project-slug "$ODE_PROJECT_SLUG" \
            --output render-output/daily-drive.json

      - name: Finish production
        run: |
          VIDEO_DURATION=$(python -c 'import json; p=json.load(open("video/generated/daily-render-input.json")); print(round(p["duration_in_frames"]/p["fps"], 2))')
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status completed \
            --stage concluido \
            --percent 100 \
            --detail "Vídeo e pacote de publicação salvos no Google Drive. A capa será gerada pelo chat." \
            --delivery-manifest render-output/daily-drive.json \
            --video-duration-seconds "$VIDEO_DURATION"

      - name: Report failure
        if: failure()
        run: |
          DETAIL="A produção falhou antes da conclusão. Consulte a etapa com erro e o pacote de revisão no GitHub Actions."
          if [ "${{ steps.editorial_contract.outcome }}" = "failure" ]; then
            DETAIL="O roteiro ou a direção declarada não passaram no contrato editorial. A narração não começou. Consulte os erros no GitHub Actions."
          elif [ "${{ steps.layout_geometry.outcome }}" = "failure" ]; then
            DETAIL="A composição foi bloqueada antes de preparar assets ou gerar voz. Consulte as cenas e os quadros no artifact daily-layout-preparation."
          elif [ "${{ steps.layout_assets.outcome }}" = "failure" ]; then
            DETAIL="O layout com os assets reais precisa de ajuste. A narração não começou. Consulte daily-layout-preflight.json e os quadros no pacote de revisão."
          elif [ "${{ steps.layout_final.outcome }}" = "failure" ]; then
            DETAIL="O layout com o tempo real da narração precisa de ajuste. O áudio válido foi preservado no cache. Consulte daily-layout-final.json e os quadros no pacote de revisão."
          fi
          python worker/progress_callback.py \
            --run-id "${{ github.run_id }}" \
            --title "$ODE_VIDEO_TITLE" \
            --status error \
            --stage erro \
            --percent 100 \
            --detail "$DETAIL"
