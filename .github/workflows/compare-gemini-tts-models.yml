name: Comparar Charon nos modelos Gemini TTS

on:
  push:
    branches:
      - codex/gemini-only-motion-design
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    # Only a push commit bearing [voice-ab] or manual dispatch spends quota.
    # A re-run of the same GitHub Actions run is skipped.
    if: >-
      github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[voice-ab]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline checks
        run: python -m unittest worker.test_compare_gemini_tts_models -v
      - name: Generate three Charon samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker/compare_gemini_tts_models.py --output-dir voice-model-comparison
      - name: Upload samples and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charon-three-models
          path: voice-model-comparison/
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize statuses
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## Charon: três modelos Gemini TTS")
          path = Path("voice-model-comparison/manifest.json")
          if not path.exists():
              print("Manifesto ausente; confira o log do job.")
          else:
              for item in json.loads(path.read_text(encoding="utf-8"))["results"]:
                  print(f"- `{item['model']}`: {item['status']}")
          PY
