name: ODE Notícias - retirar versão com erro factual registrado
on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: news-single-youtube-private-receipt
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: render-output/hold-proof
      - name: Confirmar erro registrado e retirar somente o ID original
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^noticia-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]]
          python -m pip install --disable-pip-version-check google-auth google-api-python-client
          python worker/news_content_hold.py --record "production/$PROJECT_ID/content-hold.json" --receipt render-output/hold-proof/daily-youtube-private.json --output "production/$PROJECT_ID/content-hold-receipt.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "production/$PROJECT_ID/content-hold-receipt.json"
          if ! git diff --cached --quiet; then
            git commit -m "news: confirmar retirada para correção $PROJECT_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-content-hold-proof
          path: production/${{ inputs.project_id }}/content-hold-receipt.json
          if-no-files-found: warn
