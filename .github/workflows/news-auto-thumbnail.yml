name: ODE Notícias - anexar capa automaticamente
on:
  workflow_run:
    workflows: ['ODE Notícia Única - produção real']
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      audit_path:
        type: string
        required: false
        description: 'production/noticia-.../thumbnail-audit.json; vazio busca pendências recentes'
      generate_automatically:
        type: boolean
        default: false
        description: Gerar nova capa por captura, composição e visão no GitHub antes de anexar
permissions:
  contents: write
  actions: read
concurrency:
  group: ode-cover-auto-${{ github.repository }}
  cancel-in-progress: false
jobs:
  attach:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event.workflow_run.id || '' }}
      AUDIT_INPUT: ${{ inputs.audit_path || '' }}
      FORCE_GENERATE: ${{ inputs.generate_automatically && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Encontrar vídeo comprovado e capa pendente sem novo upload
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$SOURCE_RUN" ]]; then ARGS+=(--source-run "$SOURCE_RUN"); fi
          if [[ -n "$AUDIT_INPUT" ]]; then
            [[ "$AUDIT_INPUT" =~ ^production/(noticia-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+)/thumbnail-audit\.json$ ]]
            ARGS+=(--project-id "${BASH_REMATCH[1]}")
          fi
          if [[ "$FORCE_GENERATE" == true ]]; then ARGS+=(--force-generate); fi
          python worker/news_cover_recovery.py "${ARGS[@]}"
      - name: Identificar projeto e decidir se a capa exige geração
        if: env.COVER_TARGET_AVAILABLE == 'true'
        run: |
          python worker/news_single_project.py --input "$EPISODE" --output video/generated/daily-project.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          import sys
          sys.path.insert(0,'worker')
          from thumbnail_contract import validate_thumbnail_audit
          p=Path('video/generated/daily-project.json')
          project=json.loads(p.read_text())
          image=Path('production')/project['project_id']/'thumbnail.jpg'
          generate=os.environ['FORCE_GENERATE']=='true'
          if not generate:
              try: validate_thumbnail_audit(Path.cwd(),project,image,p)
              except (ValueError,FileNotFoundError): generate=True
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('COVER_GENERATE='+str(generate).lower()+'\n')
          PY
      - uses: actions/setup-node@v4
        if: env.COVER_TARGET_AVAILABLE == 'true' && env.COVER_GENERATE == 'true'
        with:
          node-version: '22'
      - name: Preparar captura e composição gratuitas
        if: env.COVER_TARGET_AVAILABLE == 'true' && env.COVER_GENERATE == 'true'
        run: |
          python -m pip install --disable-pip-version-check requests Pillow playwright
          python -m playwright install chromium
          npm ci --no-audit --no-fund
      - name: Gerar e inspecionar capa no próprio fluxo
        id: generate
        if: env.COVER_TARGET_AVAILABLE == 'true' && env.COVER_GENERATE == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODE_NEWS_VISION_MODEL: qwen/qwen3.8-27b
        run: |
          cp video/generated/daily-project.json video/generated/news-capture-project.json
          python worker/auto_capture_sources.py --project video/generated/news-capture-project.json --captures-dir research/captures
          python - <<'PY'
          import os,re
          from pathlib import Path
          pid=os.environ['PROJECT_ID']
          assert re.fullmatch(r'noticia-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+',pid)
          folder=Path('production')/pid
          for name in ('thumbnail.jpg','thumbnail.png','thumbnail-audit.json','thumbnail-composition.json'):
              (folder/name).unlink(missing_ok=True)
          PY
          python worker/news_auto_local_cover.py --project video/generated/daily-project.json --episode "$EPISODE"
      - name: Instalar YouTube API
        if: env.COVER_TARGET_AVAILABLE == 'true'
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.35' 'google-api-python-client>=2.149'
      - name: Anexar automaticamente ao mesmo vídeo privado ou público
        id: attach
        if: env.COVER_TARGET_AVAILABLE == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python worker/youtube_publication.py thumbnail --root . --project video/generated/daily-project.json \
            --project-id "$PROJECT_ID" --receipt render-output/private-proof/daily-youtube-private.json \
            --thumbnail "production/$PROJECT_ID/thumbnail.jpg" \
            --delivery-record "production/$PROJECT_ID/thumbnail-delivery.json"
      - name: Preservar resultado e permitir retomada sem chat
        if: always() && env.COVER_TARGET_AVAILABLE == 'true'
        env:
          ATTACH_OUTCOME: ${{ steps.attach.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('production')/os.environ['PROJECT_ID']/'thumbnail-recovery.json'
          state=json.loads(p.read_text())
          state['attempts'][-1]['status']='attached' if os.environ['ATTACH_OUTCOME']=='success' else 'failed_optional_cover'
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "production/$PROJECT_ID/thumbnail-recovery.json"
          if [[ "$ATTACH_OUTCOME" == success ]]; then
            git add -- "production/$PROJECT_ID/thumbnail.jpg" "production/$PROJECT_ID/thumbnail-background.png" "production/$PROJECT_ID/thumbnail-composition.json" "production/$PROJECT_ID/thumbnail-audit.json" "production/$PROJECT_ID/thumbnail-delivery.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "news: recuperação automática de capa $PROJECT_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Comprovar imagem, auditoria e vínculo com o upload original
        if: always() && env.COVER_TARGET_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-thumbnail-delivery
          path: |
            production/${{ env.PROJECT_ID }}/thumbnail*
            video/generated/daily-project.json
            render-output/private-proof/daily-youtube-private.json
          if-no-files-found: warn
          retention-days: 30
