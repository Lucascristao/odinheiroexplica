name: Teste de vozes Azure pt-BR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/voice_test.py"
      - "worker/requirements.txt"
      - ".github/workflows/voice-test.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r worker/requirements.txt

      - name: Generate Azure voice samples
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python worker/voice_test.py

      - name: Publish samples in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          git add public/voice-tests/*.mp3
          if git diff --cached --quiet; then
            echo "No audio changes to publish."
          else
            git commit -m "test: publish Azure pt-BR voice samples"
            git push origin main
          fi
