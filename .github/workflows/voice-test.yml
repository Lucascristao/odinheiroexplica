name: Teste de vozes Kokoro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/voice_test.py"
      - "worker/requirements.txt"
      - ".github/workflows/voice-test.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r worker/requirements.txt

      - name: Generate voice samples
        run: python worker/voice_test.py

      - name: Convert samples to MP3
        run: |
          mkdir -p public/voice-tests
          for input in artifacts/voice-tests/*.wav; do
            name="$(basename "$input" .wav)"
            ffmpeg -y -i "$input" -codec:a libmp3lame -b:a 128k "public/voice-tests/$name.mp3"
          done

      - name: Publish samples in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          git add public/voice-tests/*.mp3
          if git diff --cached --quiet; then
            echo "No audio changes to publish."
          else
            git commit -m "test: publish Kokoro voice samples"
            git push origin main
          fi
