name: Teste de vozes Kokoro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/voice_test.py"
      - "worker/requirements.txt"
      - ".github/workflows/voice-test.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-ptbr-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libsndfile1

      - name: Install Python dependencies
        run: pip install -r worker/requirements.txt

      - name: Generate voice samples
        run: python worker/voice_test.py

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-ptbr-voice-test
          path: artifacts/voice-tests/*.wav
          if-no-files-found: error
          retention-days: 7
