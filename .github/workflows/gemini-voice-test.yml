name: OS4 - amostra narrada privada

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  os4-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai==2.26.0' num2words faster-whisper
      - name: Reuse the accepted narration without another API generation
        uses: actions/download-artifact@v4
        with:
          name: os4-roberta-narration
          path: os4-pilot/audio
          github-token: ${{ github.token }}
          run-id: 39107724478
      - name: Generate approved OS4 narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python os4-pilot/tts-os4-live.py --ode-root . --script os4-pilot/roteiro.md --output-dir os4-pilot/audio
      - name: Align captions to actual narration
        run: python os4-pilot/tts-align-audio.py --audio-dir os4-pilot/audio
      - name: Upload only sample audio and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os4-roberta-narration
          path: os4-pilot/audio/
          if-no-files-found: error
          retention-days: 7
