name: OS4 - voz conversada v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  os4-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai==2.26.0' num2words faster-whisper
      - name: Generate literal narration with conversational direction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python os4-pilot/tts-os4-live.py --ode-root . --plan os4-pilot/editorial-plan-v2.json --output-dir os4-pilot/audio
      - name: Align canonical captions
        run: python os4-pilot/tts-align-audio.py --audio-dir os4-pilot/audio
      - name: Upload sample audio only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os4-roberta-v2-narration
          path: os4-pilot/audio/
          if-no-files-found: error
          retention-days: 7
