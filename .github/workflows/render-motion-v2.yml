name: Render teste V2 de dinamismo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Render
        run: npm run render:motion-v2

      - name: Publish render
        run: |
          cp public/render-tests/macerio-motion-v2.mp4 /tmp/macerio-motion-v2.mp4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          mkdir -p public/render-tests
          cp /tmp/macerio-motion-v2.mp4 public/render-tests/macerio-motion-v2.mp4

          git add public/render-tests/macerio-motion-v2.mp4
          if git diff --cached --quiet; then
            echo "Render unchanged."
          else
            git commit -m "test: publish motion dynamics v2"
            git push origin main
          fi
