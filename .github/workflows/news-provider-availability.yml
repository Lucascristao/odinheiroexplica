name: ODE Notícias - conferir fallback gratuito externo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ode-news-free-provider-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Conferir API real sem produzir conteúdo nem publicar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ODE_NEWS_FREE_FALLBACK: openrouter
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'worker')
          from news_free_fallback import complete_free
          diagnostic={}
          schema={'type':'object','properties':{'ok':{'type':'boolean'}},'required':['ok'],'additionalProperties':False}
          result=json.loads(complete_free('Teste de disponibilidade sem notícia: retorne apenas {"ok":true}.',
              json_mode=True, response_schema=schema, max_output_tokens=2048, diagnostics=diagnostic))
          assert result.get('ok') is True
          Path('render-output').mkdir(exist_ok=True)
          Path('render-output/free-provider-check.json').write_text(json.dumps(diagnostic,indent=2)+'\n')
          print('FREE_TEXT_PROVIDER_AVAILABLE',diagnostic['provider'],diagnostic['model'])
          from news_draft_contract import episode_schema
          full_diagnostic={}
          fixture=json.loads(complete_free(
              'Teste técnico sem notícia e sem fontes. Retorne todos os campos do schema, '
              'insufficient_evidence=true, insufficient_reason=Sem fontes fornecidas, '
              'strings vazias e listas vazias quando faltarem dados. Não invente notícia, fonte ou data.',
              json_mode=True,response_schema=episode_schema(),max_output_tokens=5800,diagnostics=full_diagnostic))
          assert fixture.get('insufficient_evidence') is True
          assert isinstance(fixture.get('news_selection'),dict)
          assert isinstance(fixture.get('title_options'),list)
          Path('render-output/free-provider-full-schema-check.json').write_text(json.dumps(full_diagnostic,indent=2)+'\n')
          print('FREE_TEXT_PROVIDER_FULL_SCHEMA_AVAILABLE',full_diagnostic['provider'],full_diagnostic['model'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: free-provider-availability
          path: render-output/free-provider-*-check.json
