name: Entregar capa ou revisão na pasta do episódio
on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: Pasta observada na entrega do vídeo
        type: string
        required: true
      asset_path:
        description: Arquivo final em production/ no Git
        type: string
        required: true
      role:
        type: choice
        options: [thumbnail, editorial-review]
        required: true
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install delivery dependencies
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.35' 'google-api-python-client>=2.149' 'Pillow>=10.4'
      - name: Upload and verify final asset
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ODE_FOLDER_ID: ${{ inputs.folder_id }}
          ODE_ASSET_PATH: ${{ inputs.asset_path }}
          ODE_ASSET_ROLE: ${{ inputs.role }}
        run: python worker/deliver_supplement.py --folder-id "$ODE_FOLDER_ID" --asset "$ODE_ASSET_PATH" --role "$ODE_ASSET_ROLE"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-supplement-delivery
          path: render-output/daily-supplement-drive.json
          retention-days: 7
