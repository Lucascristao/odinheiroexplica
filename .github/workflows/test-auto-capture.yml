name: Testes de recortes de fontes

on:
  workflow_dispatch:
    inputs:
      live_capture:
        description: "Também capturar uma página real (depende do site externo)"
        required: false
        type: boolean
        default: false

jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Test capture and excerpt guards without page network
        run: python -m unittest worker.test_visual_source_guards

  test-capture:
    if: ${{ inputs.live_capture }}
    needs: source-guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright Pillow
          playwright install --with-deps chromium

      - name: Run Auto-Capture Robot
        run: |
          mkdir -p research/captures
          python worker/auto_capture_sources.py \
            --project video/data/test-auto-capture.json \
            --captures-dir research/captures

      - name: Upload Captured Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-captured-proof
          path: research/captures/test-gov-captura.png
          if-no-files-found: error
