name: ODE Notícias - validar apuração longa e capa com APIs reais
on:
  workflow_dispatch:
    inputs:
      news_date:
        description: Dia factual YYYY-MM-DD a avaliar, sem publicar o teste
        required: true
        type: string
      resume_run_id:
        description: Retomar rascunho rejeitado da avaliação anterior, sem repetir pesquisa
        type: string
        required: false
      cover_episode_path:
        description: Testar só captura/composição/visão de episódio existente, sem publicar ou refazer voz
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ode-news-editor
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          name: news-quality-real-evaluation
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: render-output/resumed
      - name: Preparar dependências de apuração, captura e composição
        run: |
          python -m pip install -r worker/requirements.txt
          python -m playwright install chromium
          npm ci --no-audit --no-fund
      - name: Testar pesquisa e desenvolvimento reais sem gerar gatilho de publicação
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODE_NEWS_GROQ_MODEL: openai/gpt-oss-120b
          ODE_NEWS_GROQ_MIN_INTERVAL_SECONDS: '65'
          ODE_NEWS_GROQ_FALLBACK_MODELS: openai/gpt-oss-20b
          EVALUATION_DAY: ${{ inputs.news_date }}
          RESUME: ${{ inputs.resume_run_id }}
          COVER_EPISODE: ${{ inputs.cover_episode_path }}
        run: |
          ARGS=()
          if [[ -n "$RESUME" ]]; then
            DRAFT="$(find render-output/resumed -path '*/news-editor-cache/*.json' -type f | head -1)"
            if [[ -z "$DRAFT" ]]; then
              DRAFT="$(find render-output/resumed -name 'news-editorial-rejected-draft-*.json' -type f | sort | tail -1)"
            fi
            [[ -f "$DRAFT" ]]
            ARGS=(--resume-draft "$DRAFT")
          fi
          if [[ -n "$COVER_EPISODE" ]]; then
            [[ -z "$RESUME" ]]
            [[ "$COVER_EPISODE" =~ ^news/episodes/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.json$ ]]
            mkdir -p render-output
            cp -- "$COVER_EPISODE" render-output/news-editorial-evaluation.json
            echo "COVER_ONLY_EVALUATION: reutilizar pauta existente; nenhuma nova revisão factual ou publicação."
          else
            python worker/news_autonomous_editor.py --slot noite-3 --date "$EVALUATION_DAY" --evaluation "${ARGS[@]}"
          fi
          python worker/news_single_project.py --input render-output/news-editorial-evaluation.json --output video/generated/daily-project.json
          npx tsx scripts/validate-news-single.ts video/generated/daily-project.json
          cp video/generated/daily-project.json video/generated/news-capture-project.json
          python worker/auto_capture_sources.py --project video/generated/news-capture-project.json --captures-dir research/captures
      - name: Confirmar disponibilidade real do modelo editorial reserva
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'worker')
          from news_groq_client import complete
          result=json.loads(complete('Teste de disponibilidade, sem notícia: retorne apenas {"ok":true}.',
              json_mode=True,model='openai/gpt-oss-20b',max_output_tokens=256))
          assert result.get('ok') is True
          print('EDITORIAL_BACKUP_REAL_API_AVAILABLE openai/gpt-oss-20b')
          PY
      - name: Testar capa local e revisão multimodal sem Google
        id: cover
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODE_NEWS_VISION_MODEL: qwen/qwen3.8-27b
          COVER_EPISODE: ${{ inputs.cover_episode_path }}
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          project=json.loads(Path('video/generated/daily-project.json').read_text())
          pid=project['project_id']
          assert re.fullmatch(r'noticia-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+',pid)
          folder=Path('production')/pid
          # Only this disposable runner checkout: never commit or upload the test.
          for name in ('thumbnail.jpg','thumbnail.png','thumbnail-audit.json','thumbnail-composition.json'):
              (folder/name).unlink(missing_ok=True)
          PY
          python worker/news_auto_local_cover.py --project video/generated/daily-project.json --episode render-output/news-editorial-evaluation.json
      - name: Preservar resultados reais, incluindo tentativa de capa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-quality-real-evaluation
          path: |
            render-output/news-editorial-evaluation.json
            render-output/news-editorial-diagnostics.json
            render-output/news-editorial-rejected-draft-*.json
            render-output/news-editor-cache/
            video/generated/daily-project.json
            research/captures/
            production/noticia-*/thumbnail*
          retention-days: 7
          if-no-files-found: warn
