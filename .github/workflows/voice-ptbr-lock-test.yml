name: Teste Macerio pt-BR travado

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-ptbr-lock-test.yml"

permissions:
  contents: read

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r worker/requirements.txt

      - name: Generate refined sample and upload
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import requests

          sys.path.insert(0, "worker")
          from synthesize_scenes import build_ssml
          from drive import uploader_from_env

          text = (
              "Tem uma coisa curiosa quando a gente fala de dinheiro: quase sempre o problema parece maior "
              "quando a gente olha tudo de uma vez. Mas muda bastante quando você separa as partes. "
              "Quanto entra? Quanto sai? E, principalmente, o que está levando seu dinheiro embora sem você perceber? "
              "Não é sobre cortar tudo. É sobre entender o caminho. Porque, quando o dinheiro deixa de ser uma bagunça "
              "e vira informação, as decisões começam a ficar muito mais simples."
          )

          voice = "pt-BR-MacerioMultilingualNeural"
          region = os.environ["AZURE_SPEECH_REGION"].strip()
          key = os.environ["AZURE_SPEECH_KEY"].strip()
          endpoint = f"https://{region}.tts.speech.microsoft.com/cognitiveservices/v1"

          ssml = build_ssml(text, voice, {"rate": "0%", "pitch": "+1%", "pause_ms": 120})
          response = requests.post(
              endpoint,
              headers={
                  "Ocp-Apim-Subscription-Key": key,
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3",
                  "User-Agent": "odinheiroexplica-voice-ptbr-lock",
              },
              data=ssml.encode("utf-8"),
              timeout=90,
          )
          response.raise_for_status()

          out = Path("/tmp/macerio-C-ptbr-fixo.mp3")
          out.write_bytes(response.content)

          uploader = uploader_from_env()
          if uploader is None:
              raise RuntimeError("Google Drive não configurado.")
          folder_id = uploader.create_folder("Teste voz Macerio - pt-BR fixo")
          file_id = uploader.upload(out, out.name, folder_id=folder_id)

          print(f"FILE_ID={file_id}")
          print("VOICE_PTBR_OK")
          PY
