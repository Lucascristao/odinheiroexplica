name: ODE Notícias - ensaio editorial sem publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-autonomy-integration-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar editor sem motor/render
        run: python -m pip install --disable-pip-version-check 'google-genai==2.26.0' 'requests>=2.32'
      - name: Ensaio de apuração e contrato, sem commit do episódio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python worker/news_autonomous_editor.py --slot manha --root .
          TARGET="news/episodes/$(TZ=America/Fortaleza date +%Y-%m-%d)-manha.json"
          test -s "$TARGET"
          python worker/news_single_project.py --input "$TARGET" --output /tmp/test-episode-project.json
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os
          day=datetime.now(timezone.utc).astimezone(__import__('zoneinfo').ZoneInfo('America/Fortaleza')).date().isoformat()
          article=json.loads(Path(f"news/episodes/{day}-manha.json").read_text(encoding="utf-8"))
          report={
             "result":"pass",
             "date":day,
             "source_commit":os.environ.get("GITHUB_SHA"),
             "run_id":os.environ.get("GITHUB_RUN_ID"),
             "episode_id":article["episode_id"],
             "source_count":len(article["sources"]),
             "verified_fact_count":len(article["verified_facts"]),
             "document_count":len(article["documentary_evidence"]),
             "scene_count":len(article["segments"]),
             "note":"Ensaio sem upload, capa, publicação ou commit do episódio; não substitui o início oficial às 06h."
          }
          path=Path("automation/health/autonomy-editor-test.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Salvar somente recibo de ensaio
        run: |
          git config user.name 'ode-news-test[bot]'
          git config user.email 'ode-news-test@users.noreply.github.com'
          git add automation/health/autonomy-editor-test.json
          git commit -m "ci(news): ensaio de apuracao sem publicar"
          git push origin HEAD:main
