name: ODE Notícias - publicar somente após capa e revisão
on:
  workflow_dispatch:
    inputs:
      edition_path:
        type: string
        required: true
        default: news/editions/pilot-2026-10-08-noite.json
      project_id:
        type: string
        required: true
      video_id:
        type: string
        required: true
      original_run_id:
        type: string
        required: true
      thumbnail_run_id:
        type: string
        required: true
      confirmation:
        type: string
        required: true
        description: "Digite PUBLICAR_ seguido exatamente do project_id"
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      VIDEO_ID: ${{ inputs.video_id }}
      EDITION_PATH: ${{ inputs.edition_path }}
      VIDEO_RUN: ${{ inputs.original_run_id }}
      THUMB_RUN: ${{ inputs.thumbnail_run_id }}
      ODE_PUBLISH_CONFIRM: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bibliotecas de autenticação do Google
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.35' 'google-api-python-client>=2.149'
      - name: Conferir autorização específica e recibos reais
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^noticias-[0-9]{4}-[0-9]{2}-[0-9]{2}-(manha|tarde|noite)$ ]]
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]
          [[ "$VIDEO_RUN" =~ ^[0-9]+$ && "$THUMB_RUN" =~ ^[0-9]+$ ]]
          [[ "$ODE_PUBLISH_CONFIRM" == "PUBLICAR_$PROJECT_ID" ]] || { echo "Confirmação explícita ausente"; exit 1; }
          [[ "$EDITION_PATH" =~ ^news/editions/[A-Za-z0-9._-]+\.json$ ]]
          python worker/news_project.py --input "$EDITION_PATH" --output video/generated/daily-project.json
          mkdir -p render-output/private-proof render-output/thumbnail-proof
          gh run download "$VIDEO_RUN" --repo "$GITHUB_REPOSITORY" --name news-youtube-private-receipt --dir render-output/private-proof
          gh run download "$THUMB_RUN" --repo "$GITHUB_REPOSITORY" --name youtube-thumbnail-delivery --dir render-output/thumbnail-proof
      - name: Publicar somente com imagem e revisão aprovadas
        shell: bash
        run: |
          set -euo pipefail
          BASE="production/$PROJECT_ID"
          test -s "$BASE/thumbnail-audit.json"
          test -s "$BASE/publication-approval.json"
          EXT=jpg
          [[ -f "$BASE/thumbnail.jpg" ]] || EXT=png
          test -s "$BASE/thumbnail.$EXT"
          python worker/youtube_publication.py publish \
            --project-id "$PROJECT_ID" --video-id "$VIDEO_ID" \
            --project video/generated/daily-project.json \
            --thumbnail "$BASE/thumbnail.$EXT" --root . \
            --receipt render-output/private-proof/daily-youtube-private.json \
            --thumbnail-receipt render-output/thumbnail-proof/youtube-thumbnail-delivery.json \
            --approval-file "$BASE/publication-approval.json"
