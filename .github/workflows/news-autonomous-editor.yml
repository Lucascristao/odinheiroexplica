name: ODE Notícias - redação autônoma 06h 10h 18h
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Janela local da edição (America/Fortaleza)
        type: choice
        options:
          - manha
          - meio-dia
          - noite
        required: true
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 21 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: ode-news-editor-${{ github.repository }}
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar apenas bibliotecas da redação
        run: python -m pip install --disable-pip-version-check 'google-genai==2.26.0' 'requests>=2.32'
      - name: Selecionar a janela pela agenda, não pela hora atrasada do runner
        shell: bash
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          DISPATCH_SLOT: ${{ inputs.slot }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            SLOT="$DISPATCH_SLOT"
          else
            case "$SCHEDULE_EXPRESSION" in
              '0 9 * * *') SLOT=manha ;;
              '0 13 * * *') SLOT=meio-dia ;;
              '0 21 * * *') SLOT=noite ;;
              *) echo 'Agenda não reconhecida'; exit 1 ;;
            esac
          fi
          echo "ODE_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "ODE_LOCAL_DAY=$(TZ=America/Fortaleza date +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Pesquisar, conferir fontes e criar um episódio único
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="news/episodes/$ODE_LOCAL_DAY-$ODE_SLOT.json"
          if [ -f "$TARGET" ]; then
            echo "Episódio já existe; não duplicar."
            exit 0
          fi
          python -m py_compile worker/news_scout.py worker/news_autonomous_editor.py worker/news_single_project.py
          python worker/news_autonomous_editor.py --slot "$ODE_SLOT" --root .
          python worker/news_single_project.py --input "$TARGET" --output /tmp/news-autonomous-project.json
      - name: Confirmar episódio único e iniciar render explicitamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="news/episodes/$ODE_LOCAL_DAY-$ODE_SLOT.json"
          test -s "$TARGET"
          git fetch origin main
          if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
            echo "Outra edição venceu esta janela; não duplicar."
            exit 0
          fi
          git config user.name 'ode-news-editor[bot]'
          git config user.email 'ode-news-editor@users.noreply.github.com'
          git add -- "$TARGET"
          git diff --cached --quiet && { echo 'Sem novo episódio'; exit 0; }
          git commit -m "news: edição autônoma $ODE_LOCAL_DAY $ODE_SLOT"
          git push origin HEAD:main
          gh workflow run render-news-single.yml --repo "$GITHUB_REPOSITORY" --ref main -f edition_path="$TARGET"
          echo "NOVO_EPISODIO_DISPARADO:$TARGET"
