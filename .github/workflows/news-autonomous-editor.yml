name: ODE Notícias - editor automático Groq
run-name: ODE editor | ${{ inputs.date || 'automatico' }} | ${{ inputs.slot || github.event.schedule || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Janela de edição
        type: choice
        options: [manha, manha-2, meio-dia, tarde, noite-1, noite, noite-3]
        required: true
      date:
        description: Data YYYY-MM-DD; vazio usa hoje em Fortaleza
        type: string
        required: false
  schedule:
    # Fortaleza: publicar 08h, 10h30, 13h, 16h, 18h, 20h, 22h.
    - cron: '48 8 * * *'
    - cron: '3 9 * * *'
    - cron: '18 11 * * *'
    - cron: '33 11 * * *'
    - cron: '48 13 * * *'
    - cron: '3 14 * * *'
    - cron: '48 16 * * *'
    - cron: '3 17 * * *'
    - cron: '48 18 * * *'
    - cron: '3 19 * * *'
    - cron: '48 20 * * *'
    - cron: '3 21 * * *'
    - cron: '48 22 * * *'
    - cron: '3 23 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: ode-news-editor
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolver janela nominal e recusar gatilho vencido antes de chamar API
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
          NEWS_DAY: ${{ inputs.date }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$TRIGGER" == schedule ]]; then
            CREATED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            ARGS=(--cron "$CRON" --created-at "$CREATED")
          else
            ARGS=(--slot "$SLOT" --manual)
            if [[ -n "$NEWS_DAY" ]]; then ARGS+=(--date "$NEWS_DAY"); fi
          fi
          python worker/news_schedule.py "${ARGS[@]}"
      - uses: actions/cache/restore@v4
        if: env.NEWS_SLOT_ACTIVE == 'true'
        with:
          path: render-output/news-editor-cache
          key: news-editor-state-${{ env.NEWS_DATE }}-${{ env.NEWS_SLOT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-editor-state-${{ env.NEWS_DATE }}-${{ env.NEWS_SLOT }}-
      - name: Preparar dependências editoriais e documentais
        if: env.NEWS_SLOT_ACTIVE == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r worker/requirements.txt
          python -m playwright install chromium
      - name: Selecionar, desenvolver e revisar sem usar a API Google
        if: env.NEWS_SLOT_ACTIVE == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ODE_NEWS_FREE_FALLBACK: openrouter
          ODE_NEWS_GROQ_MODEL: openai/gpt-oss-120b
          ODE_NEWS_GROQ_MIN_INTERVAL_SECONDS: '65'
          ODE_NEWS_GROQ_FALLBACK_MODELS: openai/gpt-oss-20b,llama-3.3-70b-versatile
        run: |
          set -euo pipefail
          FILE="news/episodes/$NEWS_DATE-$NEWS_SLOT.json"
          if [[ ! -e "$FILE" ]]; then
            python worker/news_autonomous_editor.py --slot "$NEWS_SLOT" --date "$NEWS_DATE" --manual
          fi
          if [[ ! -s "$FILE" ]]; then exit 0; fi
          python worker/news_single_project.py --input "$FILE" --output video/generated/daily-project.json
          cp video/generated/daily-project.json video/generated/news-capture-project.json
          python worker/auto_capture_sources.py --project video/generated/news-capture-project.json --captures-dir research/captures
      - uses: actions/cache/save@v4
        if: always() && env.NEWS_SLOT_ACTIVE == 'true' && hashFiles('render-output/news-editor-cache/*.json') != ''
        with:
          path: render-output/news-editor-cache
          key: news-editor-state-${{ env.NEWS_DATE }}-${{ env.NEWS_SLOT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preservar diagnóstico sem credenciais nem artigos completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-editorial-diagnostics
          path: |
            render-output/news-editorial-diagnostics.json
            render-output/news-editorial-rejected-draft-*.json
            news/episodes/${{ env.NEWS_DATE }}-${{ env.NEWS_SLOT }}.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-node@v4
        if: env.NEWS_SLOT_ACTIVE == 'true'
        with:
          node-version: '22'
      - name: Tentar capa original local e inspeção visual Groq, opcional
        if: env.NEWS_SLOT_ACTIVE == 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODE_NEWS_VISION_MODEL: qwen/qwen3.8-27b
        run: |
          set -euo pipefail
          FILE="news/episodes/$NEWS_DATE-$NEWS_SLOT.json"
          if [[ ! -s "$FILE" ]]; then exit 0; fi
          npm ci --no-audit --no-fund
          python worker/news_auto_local_cover.py --project video/generated/daily-project.json --episode "$FILE"
          mkdir -p render-output
          echo audited > render-output/news-thumbnail-approved.txt
      - name: Commit e retomada idempotente do motor, inclusive após falha de dispatch
        if: env.NEWS_SLOT_ACTIVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="news/episodes/$NEWS_DATE-$NEWS_SLOT.json"
          if [[ ! -s "$FILE" ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          if [[ -s render-output/news-thumbnail-approved.txt ]]; then
            PROJECT_ID="noticia-$NEWS_DATE-$NEWS_SLOT"
            git add -- "production/$PROJECT_ID/thumbnail.jpg" "production/$PROJECT_ID/thumbnail-background.png" "production/$PROJECT_ID/thumbnail-composition.json" "production/$PROJECT_ID/thumbnail-audit.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "news: produção automática $NEWS_DATE $NEWS_SLOT"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          python worker/news_render_dispatch.py --episode "$FILE" --apply --manual
      - name: Preservar decisão da entrega
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-editor-render-handoff
          path: render-output/news-render-dispatch.json
          if-no-files-found: ignore
          retention-days: 7
