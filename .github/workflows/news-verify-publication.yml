name: ODE Notícias - confirmar publicação pública
on:
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        options: [all, manha, manha-2, meio-dia, tarde, noite-1, noite, noite-3]
        default: all
      news_date:
        description: Data opcional YYYY-MM-DD para conferir uma edição
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ler os estados reais; agendamento futuro é diferente de falha
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SELECTED_SLOT: ${{ inputs.slot }}
          SELECTED_DAY: ${{ inputs.news_date }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-auth google-api-python-client tzdata
          ARGS=(--recent)
          if [[ -n "$SELECTED_SLOT" && "$SELECTED_SLOT" != all ]]; then
            ARGS=(--slot "$SELECTED_SLOT")
            if [[ -n "$SELECTED_DAY" ]]; then ARGS+=(--news-date "$SELECTED_DAY"); fi
          fi
          python worker/news_verify_publication.py "${ARGS[@]}" --output render-output/publication-check.json
      - name: Preservar estados observados e causas por episódio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ode-publication-confirmation
          path: render-output/publication-check.json
          if-no-files-found: error
          retention-days: 14
