name: Render dinâmico por cenas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "video/src/DynamicVideo.tsx"
      - "video/src/Root.tsx"
      - "video/data/dynamic-demo.json"
      - "worker/synthesize_scenes.py"
      - "worker/build_render_input.py"
      - "worker/tts_config.py"
      - ".github/workflows/render-dynamic-test.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r worker/requirements.txt

      - name: Generate Macerio audio per scene
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          mkdir -p public/generated-audio/dynamic-demo video/generated
          python worker/synthesize_scenes.py \
            --input video/data/dynamic-demo.json \
            --output-dir public/generated-audio/dynamic-demo \
            --manifest video/generated/tts-manifest.json

      - name: Build timeline from measured audio
        run: |
          python worker/build_render_input.py \
            --project video/data/dynamic-demo.json \
            --tts-manifest video/generated/tts-manifest.json \
            --audio-public-prefix generated-audio/dynamic-demo \
            --output video/generated/render-input.json

      - name: Show timeline
        run: cat video/generated/render-input.json

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Render dynamic video
        run: npm run render:dynamic-test

      - name: Preserve render
        run: cp public/render-tests/dynamic-scene-test.mp4 /tmp/dynamic-scene-test.mp4

      - name: Publish render
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          mkdir -p public/render-tests
          cp /tmp/dynamic-scene-test.mp4 public/render-tests/dynamic-scene-test.mp4

          git add public/render-tests/dynamic-scene-test.mp4
          if git diff --cached --quiet; then
            echo "Render unchanged."
          else
            git commit -m "test: publish dynamic Macerio render"
            git push origin main
          fi
