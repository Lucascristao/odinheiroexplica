name: ODE Notícia Única - produção real
on:
  workflow_dispatch:
    inputs:
      edition_path:
        type: string
        required: true
        default: news/episodes/2026-10-09-imposto-seletivo.json
  push:
    branches: [main]
    paths: [news/episodes/2026-10-09-imposto-seletivo.json, worker/news_single_project.py, worker/auto_capture_sources.py, scripts/validate-news-single.ts, .github/workflows/render-news-single.yml]
permissions:
  contents: read
concurrency:
  group: ode-news-single-${{ github.repository }}
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEWS_EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition_path || 'news/episodes/2026-10-09-imposto-seletivo.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preparar dependências
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r worker/requirements.txt
          mkdir -p video/generated render-output public/generated-audio/daily public/processed-audio/daily
      - name: Validar edição e criar projeto de notícias
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NEWS_EDITION" =~ ^news/episodes/[A-Za-z0-9._-]+\.json$ ]]
          python worker/news_single_project.py --input "$NEWS_EDITION" --output video/generated/daily-project.json
          python worker/validate_voice_policy.py
      - name: Validar todas as cenas com o contrato Zod de produção
        run: npx tsx scripts/validate-news-single.ts video/generated/daily-project.json
      - name: Validar direção visual antes da síntese
        run: |
          npm run validate:layout -- \
            --project video/generated/daily-project.json \
            --mode geometry-only \
            --output video/generated/daily-layout-geometry.json \
            --frames-dir render-output/layout-geometry
      - name: Garantir FFmpeg e FFprobe antes de gerar voz
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - name: Instalar navegador para capturas documentais
        run: python -m playwright install chromium
      - name: Capturar recortes de notícias autênticas
        run: |
          set -euo pipefail
          cp video/generated/daily-project.json video/generated/news-capture-project.json
          python worker/auto_capture_sources.py \
            --project video/generated/news-capture-project.json \
            --captures-dir research/captures
          python worker/prepare_visual_assets.py \
            --project video/generated/daily-project.json \
            --output-dir public/generated-assets \
            --manifest video/generated/daily-visual-assets.json
      - name: Efeitos sonoros originais
        run: python worker/generate_sound_design.py --output-dir public/generated-sfx
      - name: Reaproveitar narração idêntica validada do piloto
        uses: actions/cache/restore@v4
        with:
          path: public/generated-audio/daily
          key: news-live-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-live-
      - name: Narração Live Roberto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python worker/synthesize_scenes.py \
            --input video/generated/daily-project.json \
            --output-dir public/generated-audio/daily \
            --manifest video/generated/daily-tts-manifest.json \
            --diagnostics video/generated/daily-live-diagnostics.json
      - name: Preservar áudio em caso de falha
        if: always() && hashFiles('public/generated-audio/daily/*.tts.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/generated-audio/daily
          key: news-live-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Voz contínua e sincronia
        run: |
          python worker/process_voice_continuity.py \
            --input-manifest video/generated/daily-tts-manifest.json \
            --source-dir public/generated-audio/daily \
            --output-dir public/processed-audio/daily \
            --output-manifest video/generated/daily-processed-tts-manifest.json
          python worker/align_narration.py \
            --project video/generated/daily-project.json \
            --input-manifest video/generated/daily-processed-tts-manifest.json \
            --source-dir public/processed-audio/daily \
            --output-manifest video/generated/daily-aligned-tts-manifest.json \
            --report video/generated/daily-alignment-report.json
          python worker/build_render_input.py \
            --project video/generated/daily-project.json \
            --tts-manifest video/generated/daily-aligned-tts-manifest.json \
            --require-gemini --require-voice-continuity \
            --audio-public-prefix processed-audio/daily \
            --audio-dir public/processed-audio/daily \
            --visual-assets-manifest video/generated/daily-visual-assets.json \
            --output video/generated/daily-render-input.json
      - name: Música e SEO
        run: |
          python worker/generate_music.py --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json --output-dir public/generated-music
          python worker/build_youtube_package.py --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json --output render-output/daily-youtube.json
      - name: Render Remotion
        run: npm run render:daily
      - name: Garantia técnica e vocal
        run: |
          python worker/qa_delivery.py --project video/generated/daily-project.json \
            --render-input video/generated/daily-render-input.json \
            --tts-manifest video/generated/daily-aligned-tts-manifest.json \
            --audio-dir public/processed-audio/daily --video render-output/daily-video.mp4 \
            --output video/generated/daily-delivery-qa.json
      - name: Capturar quadros de revisão
        continue-on-error: true
        run: |
          python worker/review_rendered_video.py --input video/generated/daily-render-input.json \
            --video render-output/daily-video.mp4 --output-dir render-output/visual-review
      - name: Preservar vídeo e revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-single-production-review
          path: |
            video/generated/daily-project.json
            video/generated/daily-layout-geometry.json
            video/generated/daily-visual-assets.json
            research/captures/
            video/generated/daily-alignment-report.json
            video/generated/daily-delivery-qa.json
            render-output/layout-geometry/
            render-output/visual-review/
            render-output/daily-video.mp4
            render-output/daily-youtube.json
          if-no-files-found: warn
          retention-days: 7
      - name: Entregar vídeo privado sem Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PROJECT_ID="$(python -c 'import json;print(json.load(open("video/generated/daily-project.json"))["project_id"])')"
          python worker/youtube_publication.py upload-private \
            --project-id "$PROJECT_ID" --video render-output/daily-video.mp4 \
            --metadata render-output/daily-youtube.json \
            --project video/generated/daily-project.json \
            --receipt render-output/daily-youtube-private.json
      - name: Registrar pendência obrigatória de capa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("render-output/daily-youtube-private.json").read_text())
          state = {"episode_id": receipt["project_id"], "video_id": receipt["video_id"],
                   "status": "waiting_thumbnail", "thumbnail_attached": False,
                   "published": False,
                   "message": "Vídeo privado NÃO é entrega concluída. Aguardar capa auditada."}
          Path("render-output/news-delivery-state.json").write_text(json.dumps(state,indent=2)+"\n")
          print("WAITING_THUMBNAIL:", receipt["project_id"], receipt["video_id"])
          PY
      - name: Recibo do YouTube
        uses: actions/upload-artifact@v4
        with:
          name: news-single-youtube-private-receipt
          path: |
            render-output/daily-youtube-private.json
            render-output/news-delivery-state.json
          if-no-files-found: error
          retention-days: 30
