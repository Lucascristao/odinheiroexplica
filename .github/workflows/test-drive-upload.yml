name: Teste OAuth YouTube e Google Drive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-drive-upload.yml"
      - "worker/youtube_publication.py"
  workflow_dispatch:
    inputs:
      test_target:
        description: "Escolha teste Drive ou apenas verificação OAuth YouTube"
        type: choice
        options:
          - drive
          - youtube_auth
        default: youtube_auth
        required: true

permissions:
  contents: read

jobs:
  drive-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for Drive test
        if: github.event_name == 'workflow_dispatch' && inputs.test_target == 'drive'
        run: pip install --no-cache-dir -r worker/requirements.txt
      - name: Install minimal OAuth dependencies for YouTube check
        if: github.event_name == 'push' || inputs.test_target == 'youtube_auth'
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.35' 'google-api-python-client>=2.149'
      - name: Read-only YouTube channel OAuth check
        if: github.event_name == 'push' || inputs.test_target == 'youtube_auth'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python worker/youtube_publication.py verify
          python - <<'PY'
          import os
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          from worker.youtube_publication import assert_channel

          REQUIRED = {
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/youtube.readonly",
              "https://www.googleapis.com/auth/youtube.force-ssl",
          }
          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=sorted(REQUIRED),
          )
          try:
              creds.refresh(Request())
          except Exception as exc:
              raise SystemExit(
                  f"YOUTUBE_SSL_REFRESH_FAILED: {type(exc).__name__}. "
                  "Confira se o YOUTUBE_REFRESH_TOKEN do GitHub foi atualizado."
              ) from None

          granted = set(creds.granted_scopes or [])
          if not granted:
              # The server can omit scope on refresh; inspect the resulting
              # access token instead of mistaking configured scopes for consent.
              import requests
              try:
                  response = requests.get(
                      "https://oauth2.googleapis.com/tokeninfo",
                      params={"access_token": creds.token},
                      timeout=15,
                  )
                  response.raise_for_status()
                  granted = set(response.json().get("scope", "").split())
              except Exception as exc:
                  raise SystemExit(
                      f"YOUTUBE_SSL_SCOPE_UNVERIFIED: {type(exc).__name__}. "
                      "Não foi possível confirmar as permissões concedidas."
                  ) from None

          missing = REQUIRED - granted
          if missing:
              print("YOUTUBE_SSL_SCOPE_MISSING: " + ", ".join(sorted(missing)))
              raise SystemExit(1)

          try:
              service = build("youtube", "v3", credentials=creds, cache_discovery=False)
              assert_channel(service)
          except Exception as exc:
              raise SystemExit(
                  f"YOUTUBE_SSL_CHANNEL_FAILED: {type(exc).__name__}. "
                  "Autorização não confirma o canal correto."
              ) from None

          print("YOUTUBE_SSL_SCOPE_OK: youtube.upload, youtube.readonly e youtube.force-ssl.")
          print("YOUTUBE_CHANNEL_OK: O Dinheiro Explica (@odinheiro.explica).")
          print("READ_ONLY_OK: sem upload, mudança de privacidade ou publicação.")
          PY

      - name: Test Drive upload
        if: github.event_name == 'workflow_dispatch' && inputs.test_target == 'drive'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from worker.drive import uploader_from_env

          uploader = uploader_from_env()
          if uploader is None:
              raise RuntimeError("Credenciais do Google Drive não disponíveis no GitHub Actions.")

          test_file = Path("/tmp/odinheiroexplica-drive-test.txt")
          test_file.write_text(
              "Teste automático de integração do O Dinheiro Explica com Google Drive.\n",
              encoding="utf-8",
          )

          file_id = uploader.upload(test_file, "odinheiroexplica-drive-test.txt")
          print(f"UPLOAD_OK:{file_id}")

          uploader.service.files().delete(fileId=file_id).execute(num_retries=3)
          print("DELETE_OK")
          print("DRIVE_SMOKE_OK")
          PY
