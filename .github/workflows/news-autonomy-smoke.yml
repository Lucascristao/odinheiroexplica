name: ODE Notícias - testar motor sem consumir Gemini
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-autonomy-smoke.yml'
      - '.github/workflows/news-autonomous-editor.yml'
      - '.github/workflows/render-news-single.yml'
      - '.github/workflows/news-scout.yml'
      - 'worker/news_autonomous_schedule.py'
      - 'worker/news_verify_publication.py'
      - 'worker/test_news_verify_publication.py'
      - '.github/workflows/news-verify-publication.yml'
      - 'worker/news_qa_feedback.py'
      - 'worker/test_news_qa_feedback.py'
      - 'config/news-autonomy.json'
      - 'worker/test_news_autonomous_schedule.py'
      - 'worker/news_single_project.py'
      - 'worker/news_autonomous_editor.py'
      - 'worker/news_groq_client.py'
      - 'worker/news_free_fallback.py'
      - 'worker/test_news_free_fallback.py'
      - 'worker/news_source_corpus.py'
      - 'worker/news_reconstruction.py'
      - 'worker/test_news_reconstruction.py'
      - 'worker/news_schedule.py'
      - 'worker/news_production_gate.py'
      - 'worker/news_editorial_quality.py'
      - 'worker/test_news_upgrade.py'
      - 'worker/news_trigger_guard.py'
      - 'worker/test_news_trigger_guard.py'
      - '.github/workflows/news-trigger-watchdog.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar scripts e YAML sem chamadas a APIs
        run: |
          set -euo pipefail
          python -m py_compile worker/news_autonomous_schedule.py worker/news_single_project.py worker/news_autonomous_editor.py worker/news_groq_client.py worker/news_source_corpus.py worker/news_scout.py worker/test_news_autonomous_schedule.py
          python -m pip install --disable-pip-version-check PyYAML requests
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              ".github/workflows/news-autonomous-editor.yml",
              ".github/workflows/render-news-single.yml",
              ".github/workflows/news-scout.yml",
              ".github/workflows/news-autonomy-smoke.yml",
              ".github/workflows/news-verify-publication.yml",
              ".github/workflows/news-trigger-watchdog.yml",
          ]:
              data = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
              assert isinstance(data, dict) and "jobs" in data, path
              print("YAML_OK", path)
          PY
      - name: Confirmar Google exclusivamente na voz; editor e visão no Groq
        run: |
          python - <<'PY'
          from pathlib import Path
          render = Path(".github/workflows/render-news-single.yml").read_text(encoding="utf-8")
          editor = Path(".github/workflows/news-autonomous-editor.yml").read_text(encoding="utf-8")
          scout = Path(".github/workflows/news-scout.yml").read_text(encoding="utf-8")
          assert render.count("GEMINI_API_KEY:") == 1, "Chave Gemini usada fora do step de voz"
          assert "worker/news_autonomous_thumbnail.py" not in render, "Render chama imagem Gemini"
          assert "worker/news_autonomous_editor.py --slot" in editor, "Editor oficial não habilitado"
          assert "workflow_dispatch:" in editor and "schedule:" in editor, "Cron editorial ausente"
          assert "schedule:" not in scout, "Coletor auxiliar não deve rodar cron"
          assert "worker/news_render_dispatch.py --episode" in editor, "Entrega idempotente obrigatoria"
          assert "GROQ_API_KEY:" in editor, "Editor sem secret Groq"
          assert "GEMINI_API_KEY:" not in editor, "Editor/capa não podem consumir chave Google"
          assert "ODE_NEWS_GROQ_MODEL: openai/gpt-oss-120b" in editor
          code = Path("worker/news_autonomous_editor.py").read_text(encoding="utf-8")
          assert "from news_groq_client import complete" in code
          assert "genai.Client" not in code, "Editor voltou a chamar Gemini"
          print("GROQ_EDITOR_AND_GEMINI_VOICE_SEPARATION_OK")
          PY
      - name: Testar sete janelas, atraso de cron, duração e provas de apuração
        run: |
          python worker/test_news_upgrade.py
          python worker/test_news_trigger_guard.py
          python worker/test_news_free_fallback.py
      - name: Garantir reconstrução editorial limpa e proveniência fiel
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10.4'
          python -m unittest worker/test_news_reconstruction.py -v
      - name: Testar publicação agendada sem capa e proteções
        run: |
          python -m unittest worker/test_news_autonomous_schedule.py -v
          python -m unittest worker/test_news_verify_publication.py -v
          python -m unittest worker/test_news_qa_feedback.py -v
      - name: Confirmar adaptação editorial do piloto sem render nem API
        run: |
          python worker/news_single_project.py --input news/episodes/2026-10-09-imposto-seletivo.json --output /tmp/ode-pilot-transformed.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/ode-pilot-transformed.json",encoding="utf-8"))
          assert p["story"]["subject"] == p["title"]
          assert p["packaging"]["thumbnails"][0]["contract"]["exact_headline"]
          print("NEWS_ADAPTER_OK")
          PY
