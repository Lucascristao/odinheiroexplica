name: Render piloto real - Pix MED 2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "video/data/pilot-pix-med.json"
      - "video/src/EditorialPilot.tsx"
      - "video/src/Root.tsx"
      - "worker/synthesize_scenes.py"
      - "worker/build_render_input.py"
      - "worker/build_youtube_package.py"
      - "worker/tts_config.py"
      - ".github/workflows/render-pix-pilot.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r worker/requirements.txt

      - name: Generate Macerio audio per scene
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          rm -rf public/generated-audio/pix-med-pilot
          mkdir -p public/generated-audio/pix-med-pilot video/generated
          python worker/synthesize_scenes.py \
            --input video/data/pilot-pix-med.json \
            --output-dir public/generated-audio/pix-med-pilot \
            --manifest video/generated/pilot-tts-manifest.json

      - name: Build timeline from real narration
        run: |
          python worker/build_render_input.py \
            --project video/data/pilot-pix-med.json \
            --tts-manifest video/generated/pilot-tts-manifest.json \
            --audio-public-prefix generated-audio/pix-med-pilot \
            --output video/generated/pilot-render-input.json

      - name: Build YouTube package
        run: |
          python worker/build_youtube_package.py \
            --project video/data/pilot-pix-med.json \
            --render-input video/generated/pilot-render-input.json \
            --output public/render-tests/pix-med-youtube.json

      - name: Show final duration
        run: |
          python - <<'PY'
          import json
          p=json.load(open("video/generated/pilot-render-input.json"))
          print("Duration:", round(p["duration_in_frames"]/p["fps"], 2), "seconds")
          print("Scenes:", len(p["scenes"]))
          PY

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Render pilot
        run: npm run render:pix-pilot

      - name: Render thumbnail
        run: npm run still:pix-pilot

      - name: Preserve generated outputs
        run: |
          rm -rf /tmp/pix-pilot-output
          mkdir -p /tmp/pix-pilot-output
          cp public/render-tests/pix-med-pilot.mp4 /tmp/pix-pilot-output/
          cp public/render-tests/pix-med-thumbnail.png /tmp/pix-pilot-output/
          cp public/render-tests/pix-med-youtube.json /tmp/pix-pilot-output/
          cp public/render-tests/pix-med-youtube.txt /tmp/pix-pilot-output/

      - name: Publish pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          mkdir -p public/render-tests
          cp /tmp/pix-pilot-output/* public/render-tests/

          git add public/render-tests/
          if git diff --cached --quiet; then
            echo "Pilot output unchanged."
          else
            git commit -m "pilot: publish Pix MED 2.0 video package"
            git push origin main
          fi

# Pilot render trigger after workflow registration.
