<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{width:100%;height:100%;margin:0;background:#090b0d}
div[data-composition-id],svg{display:block;width:100%;height:100%}
.line{fill:none;stroke:#FFBD19;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><!--ODE_DATA-->
<div data-composition-id="ode" data-ode-states="negative,score,scr,good,consult,month" data-duration="__ODE_DURATION__" data-width="__ODE_WIDTH__" data-height="__ODE_HEIGHT__">
<svg viewBox="200 30 870 560">
<defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-opacity=".45"/></filter></defs>
<g id="folder" filter="url(#shadow)"><path d="M235 126h260l66 59h470v350H235z" fill="#1b252f" stroke="#FFBD19" stroke-width="8"/><path d="M235 230h796v305H235z" fill="#182029" stroke="#f6f7f8" stroke-width="6"/></g>
<g id="negative"><rect x="310" y="60" width="210" height="375" rx="13" fill="#f6f7f8"/><path d="M352 120h127M352 158h127M352 196h90" stroke="#34404b" stroke-width="12" stroke-linecap="round"/><circle cx="415" cy="311" r="55" fill="#FFBD19"/><path d="m392 288 46 46m0-46-46 46" stroke="#090b0d" stroke-width="12" stroke-linecap="round"/></g>
<g id="score"><rect x="555" y="60" width="210" height="375" rx="13" fill="#f6f7f8"/><path d="M597 120h127M597 158h90" stroke="#34404b" stroke-width="12" stroke-linecap="round"/><path d="M600 327a60 60 0 0 1 120 0" stroke="#34404b" stroke-width="14" fill="none"/><path id="needle" d="m660 323 38-50" class="line"/></g>
<g id="scr"><rect x="800" y="60" width="210" height="375" rx="13" fill="#f6f7f8"/><path d="M842 120h127M842 158h90M842 221h127M842 262h127M842 303h127M842 344h127" stroke="#34404b" stroke-width="12" stroke-linecap="round"/></g>
<g id="good"><circle cx="915" cy="299" r="60" fill="#FFBD19"/><path d="m886 299 21 21 39-46" stroke="#090b0d" stroke-width="13" fill="none" stroke-linecap="round"/></g>
<g id="lens" fill="none" stroke="#FFBD19" stroke-width="15"><circle cx="660" cy="405" r="78"/><path d="m715 459 76 76"/></g>
<g id="month"><rect x="810" y="215" width="190" height="88" rx="10" fill="none" stroke="#FFBD19" stroke-width="9"/><path d="M853 222v-27M943 222v-27" class="line"/></g>
</svg></div>
<script src="gsap.min.js"></script><script>
const d=window.ODE;
const tl=gsap.timeline({paused:true});

gsap.set('#negative,#score,#scr,#good,#lens,#month',{opacity:0});
tl.fromTo('#folder',{opacity:0,y:22},{opacity:1,y:0,duration:.55},0);
let last='',consults=0;
for(const s of d.states){const at=s.frame/d.fps;
 if(['negative','score','scr'].includes(s.state)){
  if(last!==s.state)tl.fromTo('#'+s.state,{opacity:0,y:90},{opacity:1,y:0,duration:.75},at);
  tl.to('#'+s.state,{opacity:1,duration:.4},at);
  for(const other of ['negative','score','scr'])if(other!==s.state&&(['score','scr'].includes(last)||s.state==='scr'))tl.to('#'+other,{opacity:.5,duration:.4},at);
  if(s.state==='score')tl.fromTo('#needle',{rotation:-18,transformOrigin:'660px 323px'},{rotation:0,duration:.8},at);
 }else if(s.state==='good'){
  tl.to('#negative,#score,#scr',{opacity:1,y:0,duration:.5},at);
  tl.fromTo('#good',{opacity:.3,scale:.65,transformOrigin:'915px 299px'},{opacity:1,scale:1,duration:.7},at);
  tl.to('#month',{opacity:0,duration:.4},at);
 }else if(s.state==='consult'){
  consults++;
  tl.to('#negative,#score,#scr',{opacity:.75,y:0,duration:.5},at);
  tl.to('#lens',{opacity:1,x:consults%2?0:245,y:consults%2?0:-145,duration:.85},at);
  tl.to('#month',{opacity:.3,duration:.4},at);
 }else if(s.state==='month'){
  tl.to('#negative,#score,#scr',{opacity:.6,y:0,duration:.5},at);
  tl.to('#scr',{opacity:1,duration:.5},at);
  tl.to('#lens',{opacity:1,x:245,y:-145,duration:.9},at);
  tl.fromTo('#month',{opacity:.3},{opacity:1,duration:.6},at);
 }else throw Error(s.state);
 last=s.state;
}

tl.to({},{duration:.01},d.duration-.01);
window.__timelines={ode:tl};
</script></body></html>
