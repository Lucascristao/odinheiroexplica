<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{width:100%;height:100%;margin:0;background:#090b0d}
div[data-composition-id],svg{display:block;width:100%;height:100%}
.line{fill:none;stroke:#FFBD19;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><!--ODE_DATA-->
<div data-composition-id="ode" data-ode-states="paid,denied,criteria,history" data-duration="__ODE_DURATION__" data-width="__ODE_WIDTH__" data-height="__ODE_HEIGHT__">
<svg viewBox="45 25 1170 570">
<defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".5"/></filter></defs>
<g id="receipt" filter="url(#shadow)"><path d="M165 74h350v460l-30-17-28 17-30-17-30 17-30-17-30 17-30-17-30 17-30-17-32 17z" fill="#f6f7f8"/>
<path d="M220 150h240M220 190h170M220 237h230M220 280h140" stroke="#34404b" stroke-width="14" stroke-linecap="round"/>
<g id="paid"><circle cx="340" cy="400" r="61" fill="#FFBD19"/><path d="m310 400 21 22 39-46" fill="none" stroke="#090b0d" stroke-width="14" stroke-linecap="round"/></g></g>
<g id="phone"><rect x="780" y="55" width="267" height="525" rx="40" fill="#182029" stroke="#f6f7f8" stroke-width="9"/>
<rect x="803" y="91" width="220" height="444" rx="21" fill="#0d1217"/><path d="M870 78h86" stroke="#34404b" stroke-width="9" stroke-linecap="round"/>
<g id="denied"><circle cx="914" cy="302" r="75" fill="#FFBD19"/><path d="m883 271 62 62m0-62-62 62" stroke="#090b0d" stroke-width="15" stroke-linecap="round"/></g>
<path d="M843 430h140M863 465h100" stroke="#34404b" stroke-width="13" stroke-linecap="round"/></g>
<g id="criteria" class="line"><path d="M562 193h148M562 322h148M562 450h148"/><circle id="risk" cx="625" cy="193" r="24" fill="#090b0d"/><circle id="capacity" cx="671" cy="322" r="24" fill="#090b0d"/><circle id="past" cx="593" cy="450" r="24" fill="#090b0d"/></g>
<g id="history"><path d="M70 385h50v175H70M1070 385h115v175h-115" stroke="#f6f7f8" stroke-width="6" fill="none"/><path class="line" d="M1094 428h67M1094 470h67M1094 510h40"/></g>
</svg></div>
<script src="gsap.min.js"></script><script>
const d=window.ODE;
const tl=gsap.timeline({paused:true});

gsap.set('#paid,#denied,#criteria,#history',{opacity:0});
tl.fromTo('#receipt',{y:24,opacity:0},{y:0,opacity:1,duration:.55},0);
tl.fromTo('#phone',{x:30,opacity:0},{x:0,opacity:1,duration:.65},.15);
let criteriaCount=0;
for(const s of d.states){const at=s.frame/d.fps;
 if(s.state==='paid'){
  tl.to('#receipt',{opacity:1,duration:.4},at);
  tl.fromTo('#paid',{opacity:.4,scale:.7,transformOrigin:'340px 400px'},{opacity:1,scale:1,duration:.65},at);
  tl.to('#phone',{opacity:.6,duration:.4},at);
 }else if(s.state==='denied'){
  tl.to('#phone',{opacity:1,duration:.4},at);
  tl.fromTo('#denied',{opacity:.4,scale:.72,transformOrigin:'914px 302px'},{opacity:1,scale:1,duration:.65},at);
  tl.to('#phone',{x:-16,duration:.23,yoyo:true,repeat:1},at);
 }else if(s.state==='criteria'){
  criteriaCount++;
  tl.to('#phone,#receipt',{opacity:1,duration:.4},at);
  tl.to('#criteria',{opacity:1,duration:.5},at);
  tl.to('#risk',{attr:{cx:criteriaCount%2?593:670},duration:.8},at);
  tl.to('#capacity',{attr:{cx:criteriaCount%2?635:595},duration:.8},at+.1);
  tl.to('#past',{attr:{cx:criteriaCount%2?675:625},duration:.8},at+.2);
  tl.to('#history',{opacity:.4,duration:.4},at);
 }else if(s.state==='history'){
  tl.to('#criteria',{opacity:.45,duration:.4},at);
  tl.fromTo('#history',{opacity:.4,y:12},{opacity:1,y:0,duration:.65},at);
  tl.to('#receipt',{opacity:.65,duration:.4},at);
  tl.to('#phone',{opacity:1,duration:.4},at);
 }else throw Error(s.state);
}

tl.to({},{duration:.01},d.duration-.01);
window.__timelines={ode:tl};
</script></body></html>
