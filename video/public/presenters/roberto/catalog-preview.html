<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roberto — referências de pose e roupa</title>
<style>
  *{box-sizing:border-box} body{margin:0;padding:22px;background:#111418;color:#f6f7f8;font:15px Arial,sans-serif}
  main{max-width:684px;margin:auto} h1{font-size:23px;margin:0 0 8px;color:#ffbd19} p{line-height:1.45;margin:0 0 18px;color:#c7ced7}
  .grid{display:grid;grid-template-columns:repeat(2,320px);gap:20px} figure{margin:0;background:#20262d;border:1px solid #39424d;border-radius:12px;overflow:hidden}
  img{display:block;width:320px;height:293px;object-fit:contain;background:#161b22} figcaption{padding:10px 12px;line-height:1.35} b{display:block;color:#ffbd19} small{color:#c7ced7}
  @media(max-width:690px){main{max-width:320px}.grid{grid-template-columns:320px}body{padding:14px}}
</style>
<main>
  <h1>Roberto: o mesmo apresentador, novas variações</h1>
  <p>Referências fixas para as próximas capas. Retratos exibidos em 320 px de largura; cada capa composta exige sua própria inspeção.</p>
  <div class="grid">
    <figure><a href="roberto-v1.png"><img src="roberto-v1.png" alt="Roberto original com camisa grafite"></a><figcaption><b>Referência original</b><small>Camisa grafite, olhar frontal</small></figcaption></figure>
    <figure><a href="roberto-v1-navy-left.png"><img src="roberto-v1-navy-left.png" alt="Roberto de blazer azul-marinho voltado à esquerda"></a><figcaption><b>Blazer azul-marinho</b><small>Três quartos, olhar à esquerda</small></figcaption></figure>
    <figure><a href="roberto-v1-blue-right.png"><img src="roberto-v1-blue-right.png" alt="Roberto com camisa azul voltado à direita"></a><figcaption><b>Camisa azul</b><small>Três quartos, olhar à direita</small></figcaption></figure>
    <figure><a href="roberto-v1-burgundy-front.png"><img src="roberto-v1-burgundy-front.png" alt="Roberto com polo vinho e sorriso discreto"></a><figcaption><b>Polo vinho</b><small>Frontal, leve inclinação e sorriso discreto</small></figcaption></figure>
  </div>
</main>
</html>
